<!doctype html>
<html lang="en"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#fff;color:#291727;font:15px/1.45 system-ui,sans-serif}h2,h3,p{margin:0}h2{color:#570044;font-size:1.18rem}h3{font-size:1rem;color:#570044}p{color:#605763}.intro{margin:6px 0 18px}.upload-card{padding:20px;border:1px solid #eadde6;border-radius:14px;background:#fcf8fb}.upload-card h3{margin-bottom:5px}.upload-card p{font-size:.87rem}.file-box{display:block;margin-top:14px;padding:17px;border:2px dashed #b888aa;border-radius:10px;background:#fff;color:#50063c;font-weight:700}.file-box span{display:block;font-size:.82rem;font-weight:400;color:#605763;margin-top:4px}.file-box input{display:block;width:100%;margin-top:12px;font:inherit;font-weight:400;color:#241e25}.file-box input::file-selector-button{margin-right:12px;padding:10px 14px;border:1px solid #720455;border-radius:7px;background:#fff;color:#720455;font:600 .9rem system-ui;cursor:pointer}.fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(120px,1fr);gap:14px;margin-top:17px}label.field{display:grid;gap:6px;font-weight:700;color:#50063c}label.field input{width:100%;min-height:46px;padding:9px 11px;border:1px solid #cfc1cd;border-radius:8px;font:inherit;font-weight:400;color:#241e25}button{min-height:46px;padding:9px 17px;border:1px solid #720455;border-radius:8px;background:#720455;color:#fff;font:600 .9rem system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.upload-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:20px}.hint{font-size:.82rem;color:#605763}.status{margin-top:12px;padding:10px 12px;border-radius:8px;background:#f4e8f0;color:#570044}.status:empty{display:none}details{margin-top:20px;border-top:1px solid #eadde6;padding-top:12px}summary{font-weight:700;color:#570044;cursor:pointer;min-height:44px;display:flex;align-items:center}ul{margin:0;padding:0;list-style:none}li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eadde6;overflow-wrap:anywhere}.remove{background:#fff;color:#720455;flex:none}input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #ffab00;outline-offset:2px}@media(max-width:520px){body{padding:16px}.upload-card{padding:15px}.fields{grid-template-columns:1fr}.upload-actions button{width:100%}li{align-items:flex-start;flex-direction:column}}
summary { gap:10px; border-radius:8px; }
summary::-webkit-details-marker { display:none; }
summary::before { content:'+'; display:grid; place-items:center; width:30px; height:30px; flex:none; border:1px solid #d8b7ce; border-radius:7px; background:#f8edf4; color:#720455; font-size:1.2rem; line-height:1; }
details[open] > summary::before { content:'−'; }
summary:hover { background:#fbf3f8; }
</style></head><body>
<h2>Add a report</h2><p class="intro">Select a PDF and enter its details to add it to the library.</p>
<form id="upload" class="upload-card"><h3>Report file</h3><p>Files are saved in the annual reports Google Drive folder.</p><label class="file-box" for="file">Select a PDF<span>Maximum file size: 50 MB</span><input id="file" type="file" accept=".pdf,application/pdf" required></label><div class="fields"><label class="field" for="title">Report title<input id="title" type="text" maxlength="255" placeholder="e.g. 2025 Annual Report" required></label><label class="field" for="year">Year (optional)<input id="year" type="number" min="1900" max="2100" placeholder="e.g. 2025"></label></div><div class="upload-actions"><span class="hint">The folder’s sharing permissions apply.</span><button id="submit">Upload PDF</button></div><p id="status" class="status" role="status" aria-live="polite"></p></form>
<details><summary>Manage files in this folder</summary><p class="hint">Moving a file to trash affects everyone using it.</p><ul id="files"></ul></details><script>
const origin = <?!= JSON.stringify(omeOrigin) ?>, token = <?!= JSON.stringify(messageToken) ?>;
const status = document.getElementById('status'), list = document.getElementById('files'), button = document.getElementById('submit');
function tell(type, payload){ if(token) window.top.postMessage({channel:'ome-annual-drive',token,type,...payload},origin); }
function fail(err){ status.textContent = err.message || 'The operation failed. Check your Google account and folder access.'; button.disabled=false; }
function refresh(){ google.script.run.withSuccessHandler(items=>{tell('catalog',{items});list.replaceChildren();if(!items.length){const li=document.createElement('li');li.textContent='No PDF files in this folder.';list.append(li)}items.forEach(file=>{const li=document.createElement('li'), name=document.createElement('span'), remove=document.createElement('button');name.textContent=file.name;remove.textContent='Move to trash';remove.className='remove';remove.type='button';remove.onclick=()=>{if(!confirm(`Move “${file.name}” to Google Drive trash? This affects everyone who uses the file.`))return;remove.disabled=true;google.script.run.withSuccessHandler(result=>{tell('deleted',{fileId:result.id});status.textContent='File moved to Drive trash.';refresh()}).withFailureHandler(err=>{remove.disabled=false;fail(err)}).trashReport(file.id)};li.append(name,remove);list.append(li)});}).withFailureHandler(fail).listReports(); }
document.getElementById('file').onchange=e=>{const file=e.target.files[0];if(file&&!document.getElementById('title').value)document.getElementById('title').value=file.name.replace(/\.pdf$/i,'')};
function startUpload(name,size){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).beginPdfUpload(name,size));}
function sendChunk(id,offset,data){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadPdfChunk(id,offset,data));}
function encodeChunk(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Could not read the file.'));reader.onload=()=>resolve(reader.result.split(',')[1]);reader.readAsDataURL(blob)});}
document.getElementById('upload').onsubmit=async e=>{e.preventDefault();const file=document.getElementById('file').files[0], title=document.getElementById('title').value.trim(), year=document.getElementById('year').value;if(!file||file.size>50*1024*1024||!/\.pdf$/i.test(file.name)){status.textContent='Choose a PDF no larger than 50 MB.';return}if(!title){status.textContent='Enter a report title.';return}button.disabled=true;status.textContent='Preparing upload…';try{const session=await startUpload(file.name,file.size);let offset=0,result;while(offset<file.size){const end=Math.min(offset+session.chunkSize,file.size);const chunk=await encodeChunk(file.slice(offset,end));result=await sendChunk(session.sessionId,offset,chunk);if(result.done){offset=file.size;break}if(result.nextOffset!==end)throw new Error('Upload progress could not be verified. Please try again.');offset=result.nextOffset;status.textContent=`Uploading to Google Drive… ${Math.round(offset/file.size*100)}%`;}if(!result||!result.done)throw new Error('Google Drive did not confirm the completed upload.');tell('uploaded',{fileId:result.id,fileType:result.type,title,year});status.textContent='Uploaded to Google Drive. Check the OME library for its registration status.';button.disabled=false;document.getElementById('upload').reset();refresh()}catch(err){fail(err)}};refresh();
</script></body></html>
